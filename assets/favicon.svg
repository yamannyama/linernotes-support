<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Liner Notes">
  <defs>
    <radialGradient id="disc" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#33291F"/>
      <stop offset="62%" stop-color="#221A12"/>
      <stop offset="100%" stop-color="#15100A"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E6B98A" stop-opacity=".9"/>
      <stop offset="55%" stop-color="#C98F5F" stop-opacity=".2"/>
      <stop offset="100%" stop-color="#E6B98A" stop-opacity=".65"/>
    </linearGradient>
  </defs>
  <!-- night tile -->
  <rect width="32" height="32" rx="7" fill="#15100A"/>
  <!-- record disc -->
  <circle cx="16" cy="16" r="12" fill="url(#disc)" stroke="url(#sheen)" stroke-width="1.1"/>
  <!-- grooves -->
  <circle cx="16" cy="16" r="9" fill="none" stroke="#C98F5F" stroke-opacity=".35" stroke-width=".7"/>
  <circle cx="16" cy="16" r="6.4" fill="none" stroke="#E6B98A" stroke-opacity=".28" stroke-width=".7"/>
  <!-- copper label -->
  <circle cx="16" cy="16" r="4.1" fill="#C98F5F"/>
  <circle cx="16" cy="16" r="4.1" fill="none" stroke="#E6B98A" stroke-opacity=".55" stroke-width=".6"/>
  <!-- spindle hole -->
  <circle cx="16" cy="16" r="1" fill="#15100A"/>
  <!-- highlight glint -->
  <path d="M9.4 10.2a9 9 0 0 1 4.2-2.9" fill="none" stroke="#F0D9BC" stroke-opacity=".6" stroke-width="1" stroke-linecap="round"/>
</svg>
